; Redirect errors to the container stderr
error_log = "/dev/stderr"
display_errors = Off

; Make sure _ENV is populated to use it in wp-config.php
variables_order = "EGPCS"

; Hide PHP version info in response headers
expose_php = Off

max_execution_time = 60
; Capped at the PHP advisory's limit for apps that take uploads, to shrink the
; attack surface of CVE-2026-109618 until the image runs PHP >= 8.4.27
upload_max_filesize = 30M
post_max_size = 32M

; Blocks the confirmed CVE-2026-109619 path; WordPress never uses it
session.upload_progress.enabled = 0

[Date]
date.timezone="UTC"
