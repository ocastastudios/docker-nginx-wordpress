[global]
; Log to stderr
error_log = /dev/stderr

[www]
; Enable status page
; pm.status_path = /status
access.log = /dev/null

; Ondemand process manager
pm = ondemand

; The number of child processes to be created when pm is set to 'static' and the
; maximum number of child processes when pm is set to 'dynamic' or 'ondemand'.
; This value sets the limit on the number of simultaneous requests that will be
; served. Equivalent to the ApacheMaxClients directive with mpm_prefork.
; Equivalent to the PHP_FCGI_CHILDREN environment variable in the original PHP
; CGI. The below defaults are based on a server without much resources. Don't
; forget to tweak pm.* to fit your needs.
; Note: Used when pm is set to 'static', 'dynamic' or 'ondemand'
; Note: This value is mandatory.
pm.max_children = 100

; The number of seconds after which an idle process will be killed.
; Note: Used only when pm is set to 'ondemand'
; Default Value: 10s
pm.process_idle_timeout = 10s;

; The number of requests each child process should execute before respawning.
; This can be useful to work around memory leaks in 3rd party libraries. For
; endless request processing specify '0'. Equivalent to PHP_FCGI_MAX_REQUESTS.
; Default Value: 0
pm.max_requests = 1000

; Make sure the FPM workers can reach the environment variables for configuration
clear_env = no

; Catch output from PHP
catch_workers_output = yes

; Remove the 'child 10 said into stderr' prefix in the log and only show the actual message
decorate_workers_output = no

; Kept even though nginx routes /health to the [health] pool instead: probing
; this one directly still answers only when a [www] worker is free, which is
; the quickest way to tell a saturated pool from a healthy one.
ping.path = /health
ping.response = Good

[health]
; Dedicated pool for the container health check. php-fpm answers ping.path from
; a child process, so while [www] is saturated the ALB probe queues behind
; application traffic and a task that is merely slow gets killed and replaced.
; Giving the probe its own listener means saturation shows up as slow responses
; instead of a restart loop (observed in production, 3 Sep 2026: 806
; client-abandoned requests while the check still passed).
listen = 127.0.0.1:9001

; Pools inherit nothing from one another, so every directive [www] picks up from
; www.conf and docker.conf has to be repeated here. Without user/group php-fpm
; refuses to start this pool at all, because the master runs as root.
user = www-data
group = www-data

; Static rather than ondemand: both workers stay resident, so the probe never
; waits on a worker spawning while the task is under memory pressure, which is
; exactly when it has to answer. These workers only ever serve ping.path and
; never bootstrap WordPress, so they cost a fraction of a [www] worker.
pm = static
pm.max_children = 2

access.log = /dev/null

; Make sure the FPM workers can reach the environment variables for configuration
clear_env = no

; Catch output from PHP
catch_workers_output = yes

; Remove the 'child 10 said into stderr' prefix in the log and only show the actual message
decorate_workers_output = no

; Enable ping page to use in healthcheck
ping.path = /health
ping.response = Good
